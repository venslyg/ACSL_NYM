    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: #0A0A0F;
            background-image: 
                linear-gradient(45deg, rgba(86, 141, 255, 0.05) 1px, transparent 1px),
                linear-gradient(-45deg, rgba(86, 141, 255, 0.05) 1px, transparent 1px);
            background-size: 64px 64px;
            color: #e4e1e9;
        }
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(176, 198, 255, 0.4), transparent);
            pointer-events: none;
        }
        .glass-card:hover {
            border-color: rgba(86, 141, 255, 0.5);
            box-shadow: 0 0 20px rgba(86, 141, 255, 0.2);
        }
        .neon-glow-border {
            position: relative;
            border: 1px solid #568dff;
            box-shadow: 0 0 10px rgba(86, 141, 255, 0.4);
            transition: all 0.3s ease;
        }
        .neon-glow-border:hover {
            box-shadow: 0 0 20px rgba(0, 244, 254, 0.6);
            background-color: #568dff;
            color: #001945;
        }
        .diagonal-accents {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.05;
            background-image: repeating-linear-gradient(45deg, #fff, #fff 1px, transparent 1px, transparent 100px);
        }
        .scanning-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f4fe, transparent);
            position: absolute;
            animation: scan 4s linear infinite;
        }
        .scanner-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f4fe, transparent);
            animation: scan 3s linear infinite;
        }
        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
        .neon-glow:hover {
            box-shadow: 0 0 20px rgba(86, 141, 255, 0.3);
            border-color: rgba(86, 141, 255, 0.6);
        }
    </style>
